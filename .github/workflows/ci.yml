name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (reference package, vectors, hub module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go/hub/go.sum
      - name: conformance-go
        run: make conformance-go
      - name: vectors are reproducible
        run: |
          make vectors
          git diff --exit-code -- vectors/
      - name: hub-consumer-check
        run: make hub-consumer-check

  hub-test:
    name: Hub tests (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Not go.mod's 1.22: under -race, TestDigestMemoryBounded allocates
      # 64.7-64.8 MiB on Go 1.22-1.25 against its 64 MiB bound, and 59.8 MiB
      # on 1.26 (without -race: 52.7 and 37.6 MiB). Back to go-version-file
      # once that test holds on the go.mod version.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/hub/go.sum
      - name: hub-test
        run: make hub-test

  python:
    name: Python conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: conformance-python
        run: make conformance-python

  typescript:
    name: TypeScript conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: conformance-ts
        run: make conformance-ts
      - name: typecheck (ts/NOTES.md)
        run: npx --yes -p typescript@7.0.2 tsc -p ts --noEmit

  hub-mutate:
    name: Hub guard mutation battery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go/hub/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: hub-mutate
        run: make hub-mutate

  smoke:
    name: Smoke test (TypeScript client against a local hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go/hub/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: smoke-local
        run: make smoke-local
